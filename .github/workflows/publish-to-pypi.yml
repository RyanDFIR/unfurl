name: Publish to PyPI

# Stage two of a release: edit the pre-release that publish-to-test-pypi.yml already
# validated and untick "pre-release". The "released" activity type fires both when a
# release is published outright and when a pre-release is converted to a release, so the
# artifact published here is built from the same commit that went to Test PyPI.
on:
  release:
    types: [released]

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dfir-unfurl
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pypa/build and twine
      run: python -m pip install build twine
    - name: Build a binary wheel and a source tarball
      run: python -m build --sdist --wheel --outdir dist/ .
    - name: Check distribution metadata
      run: python -m twine check dist/*
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
